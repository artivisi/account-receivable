<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Laporan')}"></head>
<body class="min-h-screen bg-slate-50 text-slate-900 md:pl-60">
<div th:replace="~{fragments :: sidebar('reports')}"></div>
<main class="mx-auto max-w-7xl px-4 py-8 space-y-6">
    <div>
        <h1 id="page-title" class="text-2xl font-semibold text-slate-900">Laporan</h1>
        <p class="text-sm text-slate-500" th:if="${aging.asOf}">Posisi per <span th:text="${aging.asOf}"></span></p>
    </div>
    <div th:replace="~{fragments :: reportTabs('aging')}"></div>
    <div class="card">
        <div class="table-wrap">
            <table id="aging-table" class="data-table">
                <thead class="bg-slate-50"><tr><th class="th">Bucket</th><th class="th">Jumlah</th><th class="th">Nilai</th></tr></thead>
                <tbody>
                <tr th:each="b : ${aging.buckets}" th:id="'aging-row-' + ${b.bucket}">
                    <td class="td font-medium font-mono" th:text="${b.bucket}"></td>
                    <td class="td" th:text="${b.count}"></td>
                    <td class="td font-mono" th:text="${@money.amount(b.amount)}"></td>
                </tr>
                </tbody>
                <tfoot><tr class="bg-slate-50"><td class="td font-semibold">Total</td><td class="td"></td>
                    <td id="aging-total" class="td font-semibold font-mono text-primary-700" th:text="${@money.rupiah(aging.totalOutstanding)}"></td></tr></tfoot>
            </table>
        </div>
    </div>
</main>
</body>
</html>
