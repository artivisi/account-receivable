<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Change password')}"></head>
<body class="bg-slate-50">
<div class="mx-auto flex min-h-screen max-w-xs flex-col justify-center px-4">
    <div class="card p-6">
        <h1 class="mb-2 text-lg font-semibold text-slate-900">Set a new password</h1>
        <p class="mb-4 text-sm text-slate-500">Minimum 12 characters.</p>
        <div id="change-password-error" th:if="${error}"
             class="mb-4 rounded-md bg-red-50 px-3 py-2 text-sm text-rose-700" th:text="${error}"></div>
        <form id="change-password-form" th:action="@{/change-password}" method="post" class="space-y-4">
            <div>
                <label class="label" for="currentPassword">Current password</label>
                <input class="input" type="password" id="currentPassword" name="currentPassword" required autofocus/>
            </div>
            <div>
                <label class="label" for="newPassword">New password</label>
                <input class="input" type="password" id="newPassword" name="newPassword" minlength="12" required/>
            </div>
            <div>
                <label class="label" for="confirmPassword">Confirm new password</label>
                <input class="input" type="password" id="confirmPassword" name="confirmPassword" minlength="12" required/>
            </div>
            <button id="btn-change-password" class="btn-primary w-full" type="submit">Update password</button>
        </form>
    </div>
</div>
</body>
</html>
